<form method="post" action="{% url 'logout' %}" class="portal-logout-form">
    {% csrf_token %}
    <button type="submit" class="portal-logout-btn" title="Logout" aria-label="Logout">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        <span>Logout</span>
    </button>
</form>
